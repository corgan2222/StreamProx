name: Question / Frage
description: Help with setup or usage. / Hilfe bei Einrichtung oder Bedienung.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question / Deine Frage
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: StreamProx version, Stream Deck device, OS (optional)
      placeholder: "1.2.0.0, Stream Deck MK.2, Windows 11"
